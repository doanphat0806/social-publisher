version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: xeko-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: xeko_publisher
    volumes:
      - mongo_data:/data/db
    networks:
      - xeko-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xeko-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - xeko-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xeko-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost
      - MONGO_URI=mongodb://mongodb:27017/xeko_publisher
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-xeko-super-secret-jwt-key-min-32-chars-long!}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - FACEBOOK_REDIRECT_URI=${FACEBOOK_REDIRECT_URI:-http://localhost/api/v1/facebook/oauth/callback}
      - FACEBOOK_GRAPH_VERSION=${FACEBOOK_GRAPH_VERSION:-v22.0}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - UPLOAD_DIR=/app/uploads
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xeko-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xeko-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - xeko-network

  nginx:
    image: nginx:alpine
    container_name: xeko-nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - xeko-network

volumes:
  mongo_data:
  redis_data:
  media_uploads:

networks:
  xeko-network:
    driver: bridge

